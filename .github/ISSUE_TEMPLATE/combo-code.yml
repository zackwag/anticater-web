name: New combo code
description: Report a captured Ctrl/Shift/Alt-style combo code so it can be added to COMBO_CODES
labels: ["combo-code"]
body:
  - type: input
    id: combo-text
    attributes:
      label: Combo text
      description: Exactly as typed into ANTICATER.app's Ctrl/Shift/Alt tab
      placeholder: "Ctrl+V"
    validations:
      required: true
  - type: input
    id: byte-code
    attributes:
      label: Captured byte (hex)
      description: The single-byte code observed in the 0xFD "set binding" packet
      placeholder: "0xf2"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: How it was captured (optional)
      description: e.g. debugger output, packet capture, anything useful for verification
